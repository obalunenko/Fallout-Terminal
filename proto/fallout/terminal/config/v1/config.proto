syntax = "proto3";

package fallout.terminal.config.v1;

option go_package = "github.com/obalunenko/Fallout-Terminal/internal/gen/fallout/terminal/config/v1;configv1";

message PublicRequestLimits {
  uint32 uncompressed_message_bytes = 1;
  uint32 encoded_body_bytes = 2;
  uint32 decompressed_message_bytes = 3;
  uint32 recognition_handle_bytes = 4;
  uint32 request_id_bytes = 5;
  uint32 broadcast_id_bytes = 6;
  uint32 generation_id_bytes = 7;
  uint32 terminal_id_bytes = 8;
  uint32 character_id_bytes = 9;
  uint32 action_target_bytes = 10;
  uint32 sound_category_bytes = 11;
}

message PlayerServerConfig {
  string address = 1;
  uint32 delivery_queue_size = 2;
  int64 startup_timeout_milliseconds = 3;
  PublicRequestLimits request_limits = 4;
}

message CoordinationConfig {
  uint32 request_result_limit = 1;
}

message BrowserClientConfig {
  string recognition_storage_key = 1;
  int64 reconnect_delay_milliseconds = 2;
  int64 election_lease_milliseconds = 3;
}

message PathConfig {
  string documents_directory = 1;
  string bundled_demo_path = 2;
  string application_support_directory = 3;
}

message TunnelCredentials {
  string username = 1;
  string password = 2;
}

message TunnelConfig {
  bool enabled = 1;
  string binary = 2;
  string domain = 3;
  uint32 port = 4;
  string local_url = 5;
  int64 startup_timeout_milliseconds = 6;
  optional string policy_parent = 7;
  TunnelCredentials credentials = 8;
}

message StartupConfig {
  int64 timeout_milliseconds = 1;
}

message ShutdownConfig {
  int64 grace_period_milliseconds = 1;
  int64 timeout_milliseconds = 2;
}

message ApplicationConfig {
  bool tunnel_enabled = 1;
  PlayerServerConfig player_server = 2;
  CoordinationConfig coordination = 3;
  BrowserClientConfig browser = 4;
  PathConfig paths = 5;
  TunnelConfig tunnel = 6;
  StartupConfig startup = 7;
  ShutdownConfig shutdown = 8;
}
